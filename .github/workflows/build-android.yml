name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Standalone Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟩 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Setup pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: 📂 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: ⚡ Cache pnpm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📥 Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: ☕ Setup Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: ⚙️ Expo Prebuild (Generate Native Android Project)
        run: npx expo prebuild --platform android --clean

      - name: 🔑 Configure Release Signing
        run: |
          node -e "
          const fs = require('fs');
          const file = 'android/app/build.gradle';
          let content = fs.readFileSync(file, 'utf8');
          if (!content.includes('signingConfig signingConfigs.debug\n            minifyEnabled') && !content.includes('signingConfig signingConfigs.debug\r\n            minifyEnabled')) {
            content = content.replace(/buildTypes\s*\{\s*release\s*\{/g, 'buildTypes {\n        release {\n            signingConfig signingConfigs.debug');
            fs.writeFileSync(file, content);
            console.log('Release signing config configured successfully.');
          } else {
            console.log('Release signing config already configured.');
          }
          "

      - name: 🔨 Compile Standalone Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: 🚀 Upload Standalone APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Wegenz-Practice-Standalone-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
